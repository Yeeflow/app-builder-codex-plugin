name: Plugin host compatibility
on:
  workflow_dispatch:
  pull_request:
    branches: [main, stable]
permissions:
  contents: read
jobs:
  archive-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify both archived host profiles and validator entrypoints
        run: npm run test:plugin-mcp-integration && npm run test:unified-mcp && npm run test:plugin-host-profiles
